# Name of your workflow
name: Deploy Blazor Wasm to GitHub Pages

# Run this workflow every time you push to the `main` branch
on:
  push:
    branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the .NET SDK
      - name: Setup .NET
        uses: actions/setup-net@v4
        with:
          # Your project is on .NET 9, which is a preview version. This tells the action to find it.
          dotnet-version: '9.0.x'
          include-prerelease: true

      # Publishes the Blazor project
      - name: Publish .NET Project
        run: dotnet publish PersonalAccountant/PersonalAccountant.csproj --configuration Release --output build
        # Note: If your .csproj file is not in a subfolder, remove "PersonalAccountant/" from the line above.

      # Deploys the published output to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/wwwroot
